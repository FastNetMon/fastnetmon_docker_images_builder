version: 2
jobs:
 build:
   machine:
     image: ubuntu-1604:202104-01
   steps:
     - checkout
     - run: docker build . -t fastnetmonltd/fastnetmon-advanced:2.0.280 -t fastnetmonltd/fastnetmon-advanced:latest
     - run: sudo docker images
     - run: echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
     - run: sudo docker push fastnetmonltd/fastnetmon-advanced:2.0.280
     - run: sudo docker push fastnetmonltd/fastnetmon-advanced:latest

