version: 2
jobs:
 build:
   machine:
     image: ubuntu-2004:202010-01 
   steps:
     - checkout
     - run: docker build . -t fastnetmonltd/fastnetmon-advanced:2.0.279 -t fastnetmonltd/fastnetmon-advanced:latest
     - run: sudo docker images
     - run: echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
     - run: sudo docker push fastnetmonltd/fastnetmon-advanced:2.0.279
     - run: sudo docker push fastnetmonltd/fastnetmon-advanced:latest

