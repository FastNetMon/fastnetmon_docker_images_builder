name: Build FastNetMon Docker images

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # Nightly build at 02:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  # PR builds: verify the image builds, but never touch secrets and never push.
  # GITHUB_TOKEN is reduced to no permissions as defense-in-depth.
  pr-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu_version: "22.04"
            distr_name: "jammy"
          - ubuntu_version: "24.04"
            distr_name: "noble"
    env:
      UBUNTU_VERSION: ${{ matrix.ubuntu_version }}
      FASTNETMON_DISTR_NAME: ${{ matrix.distr_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Retrieve latest stable version of FastNetMon Advanced
        run: |
          LATEST_FASTNETMON_VERSION=$(curl -s "https://storage.googleapis.com/fastnetmon_advanced_packages_unstable/ubuntu/${UBUNTU_VERSION}/fastnetmon_x86_64_latest_version.dat")
          if [ -z "$LATEST_FASTNETMON_VERSION" ]; then
            echo "Failed to fetch latest FastNetMon version"
            exit 1
          fi
          echo "LATEST_FASTNETMON_VERSION=${LATEST_FASTNETMON_VERSION}" >> "$GITHUB_ENV"
          echo "DOCKER_TAG=${LATEST_FASTNETMON_VERSION}-ubuntu${UBUNTU_VERSION}-pr${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          echo "Latest version of FastNetMon is $LATEST_FASTNETMON_VERSION"

      - name: Show build configuration
        run: |
          echo "Docker tag is $DOCKER_TAG and ubuntu name for repo $FASTNETMON_DISTR_NAME"

      - name: Build Docker image (no push)
        run: |
          docker build . \
            -t fastnetmonltd/fastnetmon-advanced:$DOCKER_TAG \
            --build-arg FASTNETMON_VERSION=$LATEST_FASTNETMON_VERSION \
            --build-arg FASTNETMON_DISTR_NAME=$FASTNETMON_DISTR_NAME \
            --build-arg UBUNTU_VERSION=$UBUNTU_VERSION

      - name: List images
        run: docker images

  # Trusted builds: push, schedule, manual dispatch. Has access to DockerHub secrets.
  build-and-publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu_version: "22.04"
            distr_name: "jammy"
            latest: false
          - ubuntu_version: "24.04"
            distr_name: "noble"
            latest: true
    env:
      UBUNTU_VERSION: ${{ matrix.ubuntu_version }}
      FASTNETMON_DISTR_NAME: ${{ matrix.distr_name }}
      LATEST: ${{ matrix.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Retrieve latest stable version of FastNetMon Advanced
        run: |
          LATEST_FASTNETMON_VERSION=$(curl -s "https://storage.googleapis.com/fastnetmon_advanced_packages_unstable/ubuntu/${UBUNTU_VERSION}/fastnetmon_x86_64_latest_version.dat")
          if [ -z "$LATEST_FASTNETMON_VERSION" ]; then
            echo "Failed to fetch latest FastNetMon version"
            exit 1
          fi
          echo "LATEST_FASTNETMON_VERSION=${LATEST_FASTNETMON_VERSION}" >> "$GITHUB_ENV"
          echo "DOCKER_TAG=${LATEST_FASTNETMON_VERSION}-ubuntu${UBUNTU_VERSION}" >> "$GITHUB_ENV"
          echo "Latest version of FastNetMon is $LATEST_FASTNETMON_VERSION"

      - name: Show build configuration
        run: |
          echo "Docker tag is $DOCKER_TAG and ubuntu name for repo $FASTNETMON_DISTR_NAME"

      - name: Build Docker image
        run: |
          docker build . \
            -t fastnetmonltd/fastnetmon-advanced:$DOCKER_TAG \
            --build-arg FASTNETMON_VERSION=$LATEST_FASTNETMON_VERSION \
            --build-arg FASTNETMON_DISTR_NAME=$FASTNETMON_DISTR_NAME \
            --build-arg UBUNTU_VERSION=$UBUNTU_VERSION

      - name: Tag as latest
        if: matrix.latest == true
        run: |
          docker image tag fastnetmonltd/fastnetmon-advanced:$DOCKER_TAG fastnetmonltd/fastnetmon-advanced:$LATEST_FASTNETMON_VERSION
          docker image tag fastnetmonltd/fastnetmon-advanced:$DOCKER_TAG fastnetmonltd/fastnetmon-advanced:latest

      - name: List images
        run: docker images

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/master'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_PASS }}
        run: echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push versioned tag
        if: github.ref == 'refs/heads/master'
        run: docker push fastnetmonltd/fastnetmon-advanced:$DOCKER_TAG

      - name: Push latest tags
        if: github.ref == 'refs/heads/master' && matrix.latest == true
        run: |
          docker push fastnetmonltd/fastnetmon-advanced:$LATEST_FASTNETMON_VERSION
          docker push fastnetmonltd/fastnetmon-advanced:latest
          docker push fastnetmon/fastnetmon-advanced:$LATEST_FASTNETMON_VERSION
          docker push fastnetmon/fastnetmon-advanced:latest
